<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="god-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ff7b00" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#991a00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#08070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="god-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#d61a3c"/>
      <stop offset="100%" stop-color="#800a20"/>
    </linearGradient>
    <linearGradient id="skin-ssg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe6d5"/>
      <stop offset="70%" stop-color="#f5b895"/>
      <stop offset="100%" stop-color="#cc815e"/>
    </linearGradient>
    <linearGradient id="gold-goku" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e"/>
      <stop offset="50%" stop-color="#c89b3c"/>
      <stop offset="100%" stop-color="#8a641a"/>
    </linearGradient>
    <filter id="god-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Divine Fire God Aura -->
  <circle cx="250" cy="250" r="230" fill="url(#god-fire)"/>
  
  <circle cx="250" cy="250" r="210" fill="none" stroke="rgba(255, 123, 0, 0.45)" stroke-width="2" stroke-dasharray="10,6"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="rgba(255, 232, 158, 0.35)" stroke-width="1.5"/>

  <!-- Goku SSG Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Hair Spikes (SSJ God - Reddish Pink / Crimson) -->
    <path d="M140,230 L80,180 L150,150 L110,90 L200,95 L220,30 L270,75 L330,40 L340,110 L410,120 L370,180 L430,220 L350,230 Z" fill="url(#god-hair)" stroke="#5e0015" stroke-width="3"/>

    <!-- Inner Hair Volume -->
    <path d="M160,200 L120,160 L180,140 L160,95 L225,110 L240,65 L280,100 L320,80 L320,130 L370,145 L340,195 Z" fill="#ff2e56" opacity="0.6"/>

    <!-- Face Contour -->
    <path d="M185,180 C185,250 205,310 250,330 C295,310 315,250 315,180 Z" fill="url(#skin-ssg)" stroke="#783416" stroke-width="3"/>
    
    <!-- Hair Bangs on Forehead -->
    <polygon points="200,170 230,240 220,170" fill="url(#god-hair)"/>
    <polygon points="245,160 270,230 275,160" fill="url(#god-hair)"/>
    <polygon points="280,165 305,215 295,165" fill="url(#god-hair)"/>

    <!-- Eyes (Divine Crimson Red Iris) -->
    <g transform="translate(0, 10)">
      <!-- Left Eye -->
      <polygon points="208,215 238,222 218,234" fill="#ffffff" stroke="#2b0a0a" stroke-width="1.5"/>
      <circle cx="225" cy="225" r="4.5" fill="#ff1a40" stroke="#750013" stroke-width="1"/>
      <circle cx="226" cy="224" r="1.5" fill="#ffffff"/>
      <!-- Right Eye -->
      <polygon points="292,215 262,222 282,234" fill="#ffffff" stroke="#2b0a0a" stroke-width="1.5"/>
      <circle cx="275" cy="225" r="4.5" fill="#ff1a40" stroke="#750013" stroke-width="1"/>
      <circle cx="274" cy="224" r="1.5" fill="#ffffff"/>

      <!-- Eyebrows (Crimson Red) -->
      <path d="M205,210 L238,218" stroke="#d61a3c" stroke-width="4" stroke-linecap="round"/>
      <path d="M295,210 L262,218" stroke="#d61a3c" stroke-width="4" stroke-linecap="round"/>

      <!-- Nose & Mouth -->
      <path d="M247,248 L253,248 L250,256 Z" fill="#b3562a"/>
      <path d="M236,275 C244,272 256,272 264,275" fill="none" stroke="#783416" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Saiyajin Gi (Orange / Blue undershirt) -->
    <path d="M175,325 L140,460 L360,460 L325,325 C295,355 205,355 175,325 Z" fill="#f75b00" stroke="#872b00" stroke-width="3"/>
    <path d="M205,340 C230,375 270,375 295,340 L310,400 C275,420 225,420 190,400 Z" fill="#0c4383" stroke="#062244" stroke-width="2"/>
    <circle cx="250" cy="385" r="18" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
    <text x="250" y="391" fill="#000000" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="900" text-anchor="middle">悟</text>
  </g>

  <!-- Official Kanji "神" (God) Stamp -->
  <g transform="translate(80, 80)">
    <rect x="-30" y="-30" width="60" height="60" fill="rgba(8,7,12,0.85)" stroke="url(#gold-goku)" stroke-width="2"/>
    <text x="0" y="10" fill="url(#gold-goku)" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="900" text-anchor="middle">神</text>
  </g>
</svg>
