<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="25%" stop-color="#ffe89e"/>
      <stop offset="55%" stop-color="#c89b3c"/>
      <stop offset="85%" stop-color="#936a1c"/>
      <stop offset="100%" stop-color="#ffe89e"/>
    </linearGradient>
    <linearGradient id="purple-hakaishin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b9a"/>
      <stop offset="50%" stop-color="#b846ff"/>
      <stop offset="100%" stop-color="#7a12eb"/>
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dragon Ball Symbol Left -->
  <g transform="translate(30, 45)">
    <circle cx="0" cy="0" r="26" fill="#f46700" stroke="url(#gold-title)" stroke-width="2.5" filter="url(#glow-gold)"/>
    <circle cx="-7" cy="-7" r="10" fill="#ff9900" opacity="0.6"/>
    <!-- 4 Stars -->
    <g fill="#ffea00">
      <polygon points="0,-12 2.5,-4 10,-4 4,1 6,8 0,3 -6,8 -4,1 -10,-4 -2.5,-4" transform="scale(0.55) translate(-14, -14)"/>
      <polygon points="0,-12 2.5,-4 10,-4 4,1 6,8 0,3 -6,8 -4,1 -10,-4 -2.5,-4" transform="scale(0.55) translate(14, -14)"/>
      <polygon points="0,-12 2.5,-4 10,-4 4,1 6,8 0,3 -6,8 -4,1 -10,-4 -2.5,-4" transform="scale(0.55) translate(-14, 14)"/>
      <polygon points="0,-12 2.5,-4 10,-4 4,1 6,8 0,3 -6,8 -4,1 -10,-4 -2.5,-4" transform="scale(0.55) translate(14, 14)"/>
    </g>
  </g>

  <!-- Title Text Group -->
  <g transform="translate(75, 16)">
    <!-- Japanese Katakana Subtitle -->
    <text x="0" y="10" fill="#ffe89e" font-family="'Cinzel', 'Noto Sans JP', sans-serif" font-size="8" font-weight="700" letter-spacing="4" opacity="0.85">ドラゴンボール超 • 破壊神ビルス編</text>
    
    <!-- DRAGON BALL -->
    <text x="0" y="34" fill="url(#gold-title)" font-family="'Cinzel', 'Montserrat', Impact, sans-serif" font-size="28" font-weight="900" letter-spacing="2.5" filter="url(#glow-gold)">DRAGON BALL</text>
    
    <!-- SUPER BEERUS -->
    <g transform="translate(0, 52)">
      <!-- SUPER Badge -->
      <rect x="0" y="-12" width="76" height="18" rx="2" fill="url(#gold-title)"/>
      <text x="38" y="1" fill="#08070c" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" letter-spacing="3" text-anchor="middle">SUPER</text>
      
      <!-- BEERUS Text with Purple Hakai Gradient -->
      <text x="86" y="2" fill="url(#purple-hakaishin)" font-family="'Cinzel', Impact, sans-serif" font-size="20" font-weight="900" letter-spacing="4">BEERUS SAGA</text>
    </g>
  </g>

  <!-- Ornate Right Accents -->
  <g transform="translate(425, 45)" stroke="url(#gold-title)" stroke-width="2" fill="none">
    <path d="M-10,-20 L5,-5 L-10,10"/>
    <path d="M0,-20 L15,-5 L0,10"/>
  </g>
</svg>
